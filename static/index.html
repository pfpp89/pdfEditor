<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Editor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="toolbar">
    <div class="group">
      <button id="btn-open" title="Open a PDF (Ctrl+O)">
        <svg class="icon icon-folder" viewBox="0 0 16 16" aria-hidden="true">
          <path fill="currentColor" d="M1.5 4A1.5 1.5 0 0 1 3 2.5h3.2l1.5 1.5H13A1.5 1.5 0 0 1 14.5 5.5v6A1.5 1.5 0 0 1 13 13H3a1.5 1.5 0 0 1-1.5-1.5z"/>
        </svg>Open</button>
      <button id="btn-append" title="Append one or more PDFs to the end" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
          <path d="M14 3v5h5"/>
          <path d="M12 11.5v7M8.5 15h7"/>
        </svg>Append PDFs</button>
    </div>
    <div class="group">
      <button id="btn-delete" class="danger" title="Delete selected pages (Del)" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
          <path d="M14 3v5h5"/>
          <path d="M9.5 12.5l5 5M14.5 12.5l-5 5"/>
        </svg>Delete</button>
      <button id="btn-start" title="Move selected pages to the start" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M11 6.5L3.5 12l7.5 5.5z"/>
          <path d="M20.5 6.5L13 12l7.5 5.5z"/>
        </svg>Move to start</button>
      <button id="btn-end" title="Move selected pages to the end" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M3.5 6.5L11 12l-7.5 5.5z"/>
          <path d="M13 6.5l7.5 5.5-7.5 5.5z"/>
        </svg>Move to end</button>
    </div>
    <div class="group">
      <button id="btn-undo" title="Undo (Ctrl+Z)" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 14L4 9l5-5"/>
          <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>
        </svg>Undo</button>
      <button id="btn-redo" title="Redo (Ctrl+Y)" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 14l5-5-5-5"/>
          <path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>
        </svg>Redo</button>
    </div>
    <div class="group">
      <button id="btn-save" class="primary" title="Save as a new PDF (Ctrl+S)" disabled>Save As…</button>
    </div>
    <label class="zoom" title="Thumbnail size">
      Size <input id="zoom" type="range" min="100" max="400" step="20" value="160">
    </label>
  </header>

  <div id="sources" class="sources"></div>

  <main id="grid" class="grid" tabindex="0"></main>

  <div id="empty" class="empty">
    <p>Open a PDF to get started.</p>
    <button id="btn-open-empty" class="primary">Open PDF</button>
    <p class="hint">Files are processed on this computer only.</p>
  </div>

  <footer class="status">
    <span id="status-text">No document</span>
    <span class="hint">Click to select · Ctrl+click to toggle · Shift+click for a range · Drag to reorder · Double-click to preview</span>
  </footer>

  <div id="toast" class="toast" hidden></div>

  <div id="ctx-menu" class="ctx-menu" role="menu" hidden>
    <button id="ctx-delete" class="ctx-danger" role="menuitem">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
        <path d="M14 3v5h5"/>
        <path d="M9.5 12.5l5 5M14.5 12.5l-5 5"/>
      </svg><span id="ctx-delete-label">Delete</span><span class="shortcut">Del</span></button>
  </div>

  <dialog id="preview" class="preview">
    <div class="preview-bar">
      <button id="prev-back" title="Previous page (←)">‹</button>
      <span id="prev-label"></span>
      <button id="prev-next" title="Next page (→)">›</button>
      <button id="prev-close" title="Close (Esc)">✕</button>
    </div>
    <div class="preview-body"><img id="prev-img" alt=""></div>
  </dialog>

  <dialog id="pw-dialog" class="pw-dialog">
    <form method="dialog">
      <p id="pw-label"></p>
      <input id="pw-input" type="password" autocomplete="off">
      <div class="pw-actions">
        <button value="cancel" formnovalidate>Skip file</button>
        <button value="ok" class="primary">Unlock</button>
      </div>
    </form>
  </dialog>

  <dialog id="saved-dialog" class="saved-dialog">
    <form method="dialog">
      <p class="saved-title">PDF saved</p>
      <p id="saved-path" class="saved-path"></p>
      <p>Open it in your default PDF viewer?</p>
      <div class="pw-actions">
        <button value="cancel">Not now</button>
        <button value="open" class="primary" autofocus>Open</button>
      </div>
    </form>
  </dialog>

  <input id="file-input" type="file" accept=".pdf,application/pdf" multiple hidden>

  <script src="/static/app.js"></script>
</body>
</html>
